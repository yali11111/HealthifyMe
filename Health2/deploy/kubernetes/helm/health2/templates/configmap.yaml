apiVersion: v1
kind: ConfigMap

metadata:

  name: {{ include "health2.fullname" . }}-config

  labels:
    {{- include "health2.labels" . | nindent 4 }}

data:

  SPRING_PROFILES_ACTIVE: {{ .Values.config.springProfile | quote }}

  SERVER_PORT: {{ .Values.config.serverPort | quote }}

  MANAGEMENT_SERVER_PORT: {{ .Values.config.managementPort | quote }}

  JAVA_TOOL_OPTIONS: {{ .Values.config.javaToolOptions | quote }}
