apiVersion: apps/v1
kind: Deployment

metadata:

  name: {{ include "health2.fullname" . }}

  labels:
    {{- include "health2.labels" . | nindent 4 }}

spec:

  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}

  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}

  strategy:

    type: RollingUpdate

    rollingUpdate:

      maxSurge: 1

      maxUnavailable: 0

  selector:

    matchLabels:
      {{- include "health2.selectorLabels" . | nindent 6 }}

  template:

    metadata:

      labels:
        {{- include "health2.selectorLabels" . | nindent 8 }}

        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

    spec:

      serviceAccountName: {{ include "health2.serviceAccountName" . }}

      automountServiceAccountToken: false

      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}

      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:

        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}

          topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}

          whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}

          minDomains: {{ .Values.topologySpreadConstraints.minDomains }}

          labelSelector:

            matchLabels:
              {{- include "health2.selectorLabels" . | nindent 14 }}
      {{- end }}

      containers:

        - name: health2-backend

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}

          ports:

            - name: http

              containerPort: {{ .Values.containerPort }}

              protocol: TCP

          envFrom:

            - configMapRef:

                name: {{ include "health2.fullname" . }}-config

            - secretRef:

                name: {{ .Values.existingSecret }}

                optional: false

          startupProbe:

            httpGet:

              path: {{ .Values.config.managementHealthPath }}/readiness

              port: http

            periodSeconds: 10

            failureThreshold: 30

          readinessProbe:

            httpGet:

              path: {{ .Values.config.readinessPath }}

              port: http

            periodSeconds: 10

            timeoutSeconds: 3

            failureThreshold: 3

          livenessProbe:

            httpGet:

              path: {{ .Values.config.livenessPath }}

              port: http

            periodSeconds: 20

            timeoutSeconds: 3

            failureThreshold: 3

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:

            - name: tmp

              mountPath: /tmp

      volumes:

        - name: tmp

          emptyDir:
            sizeLimit: 128Mi
