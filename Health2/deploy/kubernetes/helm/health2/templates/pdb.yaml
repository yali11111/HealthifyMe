{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget

metadata:

  name: {{ include "health2.fullname" . }}

  labels:
    {{- include "health2.labels" . | nindent 4 }}

spec:

  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}

  selector:

    matchLabels:
      {{- include "health2.selectorLabels" . | nindent 6 }}
{{- end }}
