replicaCount: 3

config:

  springProfile: prod

image:

  tag: "CHANGE_ME"

  pullPolicy: IfNotPresent

autoscaling:

  enabled: true

  minReplicas: 3

  maxReplicas: 10

  targetCPUUtilizationPercentage: 65

  targetMemoryUtilizationPercentage: 75

podDisruptionBudget:

  enabled: true

  minAvailable: 2

resources:

  requests:

    cpu: 500m

    memory: 768Mi

  limits:

    cpu: "2"

    memory: 2Gi

topologySpreadConstraints:

  enabled: true

  maxSkew: 1

  topologyKey: kubernetes.io/hostname

  whenUnsatisfiable: DoNotSchedule

  minDomains: 2

terminationGracePeriodSeconds: 45

revisionHistoryLimit: 10
