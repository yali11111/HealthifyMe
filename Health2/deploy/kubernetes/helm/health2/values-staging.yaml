replicaCount: 2

config:

  springProfile: staging

image:

  tag: "staging"

autoscaling:

  enabled: true

  minReplicas: 2

  maxReplicas: 4

  targetCPUUtilizationPercentage: 70

  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:

  enabled: true

  minAvailable: 1

resources:

  requests:

    cpu: 250m

    memory: 512Mi

  limits:

    cpu: "1"

    memory: 1Gi
