apiVersion: monitoring.coreos.com/v1

kind: ServiceMonitor

metadata:

  name: health2-backend

  namespace: monitoring

  labels:

    release: health2-monitoring

    app.kubernetes.io/name: health2-backend

spec:

  namespaceSelector:

    matchNames:
      - health2

  selector:

    matchLabels:
      app: health2-backend

  endpoints:

    - port: http

      path: /actuator/prometheus

      interval: 30s

      scrapeTimeout: 10s

      scheme: http
