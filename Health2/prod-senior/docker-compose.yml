services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - prod-senior_postgres:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prod-senior_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6382:6379"
    volumes:
      - prod-senior_redis:/data
    networks:
      - prod-senior_network

  adminer:
    image: adminer:latest
    profiles:
      - tools
    ports:
      - "127.0.0.1:6435:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - prod-senior_network

volumes:
  prod-senior_postgres:
  prod-senior_redis:

networks:
  prod-senior_network:
    name: health2_prod-senior_network
